[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-agent"
version = "0.1.0"
description = "CLI and ReAct agent toolkit for independent AI music capabilities."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
music-agent = "music_agent.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
agent-openai = [
    "openai>=2.0.0",
    "pydantic>=2.6",
]
web = [
    "fastapi>=0.115",
    "httpx2>=0.28",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]
audio-slice = [
    "numpy>=1.26",
    "soundfile>=0.12",
]
analysis-essentia = [
    "essentia",
    "numpy>=1.26",
]
musicgen-local = [
    "accelerate>=0.28",
    "scipy>=1.12",
    "sentencepiece>=0.2",
    "torch>=2.2",
    "transformers>=4.37",
]
separation-msst = [
    "beartype>=0.14",
    "einops>=0.6",
    "librosa>=0.10",
    "ml-collections>=0.1",
    "neuraloperator>=2.0",
    "PyYAML>=6.0",
    "rotary-embedding-torch>=0.3",
    "safetensors>=0.7",
    "soundfile>=0.12",
    "torch>=2.2",
    "tqdm>=4.66",
]
style-essentia = [
    "essentia-tensorflow",
    "numpy>=1.26",
]
vocal-curation = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "soundfile>=0.12",
    "speechbrain>=1.0",
    "torch>=2.2",
    "torchaudio>=2.2",
    "tqdm>=4.66",
]
voice-svcfusion = [
    "einops>=0.8",
    "faiss-cpu>=1.8",
    "ffmpeg-python>=0.2",
    "gradio>=4.36",
    "hydra-core>=1.0",
    "librosa>=0.10",
    "local-attention>=1.9",
    "matplotlib>=3.8",
    "ml-collections>=0.1",
    "numpy>=1.26",
    "omegaconf>=2.0",
    "praat-parselmouth>=0.4",
    "pydub>=0.25",
    "pyworld>=0.3",
    "PyYAML>=6.0",
    "resampy>=0.4",
    "scikit-learn>=1.4",
    "scipy>=1.10",
    "soundfile>=0.12",
    "torch>=2.2",
    "torchaudio>=2.2",
    "torchcrepe>=0.0.22",
    "torchfcpe>=0.0.4",
    "tqdm>=4.66",
    "transformers>=4.37",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["MSST_AGPL_LICENSE.txt", "OPENVPI_AUDIO_SLICER_LICENSE.txt", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.package-data]
"music_agent.separation.msst_roformer" = ["NOTICE.md"]
"music_agent.skills" = ["builtin/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

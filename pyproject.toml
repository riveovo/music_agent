[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-agent"
version = "0.1.0"
description = "CLI-first MVP for an AI music agent with independent music capabilities."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
music-agent = "music_agent.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
musicgen-local = [
    "accelerate>=0.28",
    "scipy>=1.12",
    "sentencepiece>=0.2",
    "torch>=2.2",
    "transformers>=4.37",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
